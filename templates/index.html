<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Football Predictor</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
    <h1>🏈 College Football Predictor</h1>
    <form method="POST">
        <label>Home Team:</label>
        <select name="home_team">
            {% for team in teams %}
                <option value="{{ team }}">{{ team }}</option>
            {% endfor %}
        </select>

        <label>Away Team:</label>
        <select name="away_team">
            {% for team in teams %}
                <option value="{{ team }}">{{ team }}</option>
            {% endfor %}
        </select>

        <br><br>
        <button type="submit">Predict Game</button>
    </form>

    {% if result %}
        <h2 style="margin-top: 40px;">{{ result }}</h2>
    {% endif %}
</body>
</html>
