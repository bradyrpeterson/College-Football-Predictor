<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Football Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="container">
    <h1>🏈 College Football Predictor</h1>
    <p>Select two FBS teams to predict the winner based on previous results and analytics.</p>

    <form method="POST">
      <div class="form-group">
        <label for="home_team">Home Team:</label>
        <select name="home_team" id="home_team" required>
          {% for team in teams %}
          <option value="{{ team }}">{{ team }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="away_team">Away Team:</label>
        <select name="away_team" id="away_team" required>
          {% for team in teams %}
          <option value="{{ team }}">{{ team }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit">Predict Game</button>
    </form>

    {% if result %}
    <div class="result-box">
      <h2>{{ result }}</h2>
    </div>
    {% endif %}
  </div>
</body>
</html>
